name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate-release:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - name: Validate stable semantic version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must be a stable semantic version such as v1.2.3" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require release commit on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release tags must point to a commit reachable from main" >&2
            exit 1
          }
      - name: Require tag to match embedded version
        env:
          TAG: ${{ github.ref_name }}
        run: test "$TAG" = "v$(tr -d '[:space:]' < internal/version/VERSION)"

  test:
    name: Test
    needs: validate-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - name: Cloudflare token helper test
        run: bash scripts/create-cloudflare-token_test.sh
      - run: go vet ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
            uname-arch: x86_64
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
            uname-arch: aarch64
          - goos: darwin
            goarch: amd64
            runner: macos-15-intel
            uname-arch: x86_64
          - goos: darwin
            goarch: arm64
            runner: macos-15
            uname-arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify native runner
        env:
          EXPECTED_ARCH: ${{ matrix.uname-arch }}
        run: test "$(uname -m)" = "$EXPECTED_ARCH"
      - name: Build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="cf-redirect_${version}_${GOOS}_${GOARCH}"
          mkdir -p "dist/${archive}"
          go build -trimpath -ldflags="-s -w" -o "dist/${archive}/cf-redirect" ./cmd/cf-redirect
          "dist/${archive}/cf-redirect" --help
          tar -C dist -czf "dist/${archive}.tar.gz" "${archive}"
          tar -tzf "dist/${archive}.tar.gz" >/dev/null
          rm -rf "dist/${archive}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cf-redirect-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cf-redirect-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum ./*.tar.gz > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"

  update-homebrew:
    name: Update Homebrew formula
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Create Homebrew tap token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.HOMEBREW_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-tap
          permission-contents: write
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cf-redirect-*
          path: dist
          merge-multiple: true
      - name: Check out Homebrew tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/homebrew-tap
          token: ${{ steps.app-token.outputs.token }}
          path: homebrew-tap
      - name: Update formula
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          darwin_arm64_sha="$(sha256sum "dist/cf-redirect_${version}_darwin_arm64.tar.gz" | cut -d ' ' -f1)"
          darwin_amd64_sha="$(sha256sum "dist/cf-redirect_${version}_darwin_amd64.tar.gz" | cut -d ' ' -f1)"
          linux_arm64_sha="$(sha256sum "dist/cf-redirect_${version}_linux_arm64.tar.gz" | cut -d ' ' -f1)"
          linux_amd64_sha="$(sha256sum "dist/cf-redirect_${version}_linux_amd64.tar.gz" | cut -d ' ' -f1)"
          python3 - "$version" \
            "darwin_arm64=$darwin_arm64_sha" \
            "darwin_amd64=$darwin_amd64_sha" \
            "linux_arm64=$linux_arm64_sha" \
            "linux_amd64=$linux_amd64_sha" <<'PY'
          from pathlib import Path
          import re
          import sys

          version, *checksum_args = sys.argv[1:]
          checksums = dict(argument.split("=", 1) for argument in checksum_args)
          archives = {
              "darwin_arm64": "darwin_arm64",
              "darwin_amd64": "darwin_amd64",
              "linux_arm64": "linux_arm64",
              "linux_amd64": "linux_amd64",
          }
          path = Path("homebrew-tap/Formula/cf-redirect.rb")
          formula = path.read_text()
          formula, version_changes = re.subn(
              r'^  version "[^"]+"$', f'  version "{version}"', formula, count=1, flags=re.MULTILINE
          )
          checksum_changes = 0
          for platform, archive in archives.items():
              pattern = (
                  rf'(?m)(^      url "[^"]+/cf-redirect_#\{{version\}}_{archive}\.tar\.gz"\n'
                  rf'      sha256 )"[0-9a-f]{{64}}"$'
              )
              formula, changes = re.subn(pattern, rf'\g<1>"{checksums[platform]}"', formula, count=1)
              checksum_changes += changes
          if version_changes != 1 or checksum_changes != len(archives):
              raise SystemExit("could not find the expected version and platform checksum URL blocks")
          path.write_text(formula)
          PY
          ruby -c homebrew-tap/Formula/cf-redirect.rb
      - name: Commit and push formula
        working-directory: homebrew-tap
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          git add Formula/cf-redirect.rb
          git diff --cached --check
          git commit -m "Update cf-redirect to ${version}"
          git push origin HEAD:main

  verify-homebrew:
    name: Verify Homebrew formula (${{ matrix.goarch }})
    needs: update-homebrew
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            runner: macos-15-intel
            uname-arch: x86_64
          - goarch: arm64
            runner: macos-15
            uname-arch: arm64
    steps:
      - name: Verify native runner
        env:
          EXPECTED_ARCH: ${{ matrix.uname-arch }}
        run: test "$(uname -m)" = "$EXPECTED_ARCH"
      - name: Install release formula
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          brew update
          brew uninstall --force cf-redirect 2>/dev/null || true
          brew install koopycat/tap/cf-redirect
          version="${VERSION#v}"
          test "$(brew list --versions cf-redirect | awk '{print $2}')" = "$version"
          "$(brew --prefix cf-redirect)/bin/cf-redirect" --help
      - name: Test release formula
        run: brew test koopycat/tap/cf-redirect
